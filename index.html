<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yggdrasil Finance</title>
  <meta name="theme-color" content="#2f6b4f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Yggdrasil</span>
    </div>
    <button class="sync-pill" id="syncPill" data-action="sync" type="button">
      <span class="dot"></span><span class="label">…</span>
    </button>
  </header>

  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-history" hidden></section>
    <section class="view" id="view-goals" hidden></section>
    <section class="view" id="view-more" hidden></section>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <div class="composer-preview" id="composerPreview"></div>
    <div class="composer-row">
      <label class="date-chip" title="Tanggal transaksi">
        <input type="date" id="composerDate">
        <span id="composerDateLabel">Hari ini</span>
      </label>
      <textarea id="composerInput" rows="1" placeholder="-30k ayam geprek" enterkeyhint="send" aria-label="Catat transaksi"></textarea>
      <button type="submit" class="send" aria-label="Catat">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </form>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>
      <span>Beranda</span>
    </button>
    <button data-tab="history" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
      <span>Riwayat</span>
    </button>
    <button data-tab="goals" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6"/></svg>
      <span>Target</span>
    </button>
    <button data-tab="more" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg>
      <span>Lainnya</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
